name: Deploy site to GitHub Pages

# The site lives in site/, not the repo root, so Pages is fed by an artifact
# upload rather than the "deploy from a branch" setting (which only offers the
# root or /docs). This also means Jekyll never runs, so nothing in the repo is
# published except what is inside site/.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: the daily data push
# would otherwise be able to abort a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
